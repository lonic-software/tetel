name: release

# A v* tag builds every target and publishes the release. A pull request
# touching the installers or this file, or a manual run, builds, packages and
# installs the same matrix and stops there — so a broken target or installer
# shows up before a tag depends on it.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths: ["install.sh", "install.ps1", ".github/workflows/release.yml"]
  workflow_dispatch:

# Write only where it is used: the build job runs the PR's own code.
permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-14
          - target: x86_64-apple-darwin
            os: macos-14
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # musl-gcc compiles ring's C and assembly (ureq's TLS) for the static
      # Linux targets.
      - name: Install musl tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Add target
        run: rustup target add ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      # Assets are named WITHOUT the version so the installer can use the
      # stable /releases/latest/download/ URL (no API calls, no rate limits).
      - name: Package (unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          tar -C target/${{ matrix.target }}/release -czf dist/tetel-${{ matrix.target }}.tar.gz tetel

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path target/${{ matrix.target }}/release/tetel.exe -DestinationPath dist/tetel-${{ matrix.target }}.zip

      # Each installer, run against the archive just built, on the platform
      # it serves. `under` makes uname report the target's arch: macos-14 is
      # arm64 and runs the x86_64 build through Rosetta.
      - name: Installer smoke (install.sh)
        if: runner.os != 'Windows'
        env:
          UNDER: ${{ contains(matrix.target, 'x86_64-apple') && 'arch -x86_64' || '' }}
        run: |
          rel="$RUNNER_TEMP/rel"; bin="$RUNNER_TEMP/bin"
          mkdir -p "$rel" && cp dist/* "$rel"/
          if command -v sha256sum >/dev/null; then sum="sha256sum"; else sum="shasum -a 256"; fi
          (cd "$rel" && $sum -- * > checksums.txt)
          TETEL_BASE_URL="file://$rel" TETEL_INSTALL_DIR="$bin" $UNDER sh install.sh
          $UNDER "$bin/tetel" --version

      # Twice: a fresh install under Windows PowerShell 5.1 (what a stock
      # `irm | iex` gets), then an upgrade under pwsh 7 while a `tetel mcp`
      # server holds the installed exe open — the move-aside path.
      - name: Installer smoke (install.ps1)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $rel = Join-Path $env:RUNNER_TEMP rel
          New-Item -ItemType Directory -Force $rel | Out-Null
          Copy-Item dist/* $rel
          $zip = "tetel-${{ matrix.target }}.zip"
          $h = (Get-FileHash (Join-Path $rel $zip) -Algorithm SHA256).Hash.ToLower()
          [IO.File]::WriteAllText((Join-Path $rel checksums.txt), "$h  $zip`n")
          # Every file as application/octet-stream, as GitHub serves release
          # assets — a text/plain checksums.txt hides how IWR decodes it.
          $srvpy = Join-Path $env:RUNNER_TEMP serve.py
          Set-Content $srvpy @(
            'import functools, http.server as h, sys'
            'class H(h.SimpleHTTPRequestHandler):'
            '    def guess_type(self, path): return "application/octet-stream"'
            'h.ThreadingHTTPServer(("127.0.0.1", 8765), functools.partial(H, directory=sys.argv[1])).serve_forever()'
          )
          $srv = Start-Process python -ArgumentList $srvpy, $rel -PassThru
          Start-Sleep 3
          $env:TETEL_BASE_URL = "http://127.0.0.1:8765"
          $env:TETEL_INSTALL_DIR = Join-Path $env:RUNNER_TEMP bin
          $exe = Join-Path $env:TETEL_INSTALL_DIR tetel.exe
          try {
            powershell -NoProfile -ExecutionPolicy Bypass -File install.ps1
            if ($LASTEXITCODE) { throw "install.ps1 failed under Windows PowerShell" }

            $psi = New-Object System.Diagnostics.ProcessStartInfo $exe, 'mcp'
            $psi.RedirectStandardInput = $true
            $psi.UseShellExecute = $false
            $server = [System.Diagnostics.Process]::Start($psi)
            Start-Sleep 1
            if ($server.HasExited) { throw "tetel mcp exited early; the upgrade would not be under load" }

            pwsh -NoProfile -File install.ps1
            if ($LASTEXITCODE) { throw "install.ps1 upgrade failed under pwsh" }
            if ($server.HasExited) { throw "the upgrade killed the running server" }
            & $exe --version
            if ($LASTEXITCODE) { throw "installed tetel.exe does not run" }
            $server.Kill()
          } finally {
            Stop-Process -Id $srv.Id -ErrorAction SilentlyContinue
          }

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        run: cd dist && sha256sum -- * > checksums.txt

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
