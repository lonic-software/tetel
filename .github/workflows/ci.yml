# The guards run locally via the PostToolUse hook in .claude/settings.json,
# but that only helps whoever is editing with Claude Code. This makes them
# authoritative for the repository — including for a contributor who has
# never heard of that hook.
#
# Several platforms on purpose, not for portability theatre. `buildid.rs` and
# `worldstate.rs` both document behaviour that differs between macOS and
# Linux — `current_exe()` resolving through /proc/self/exe, and what a
# rename-replace does to a running binary. Those claims were reasoned about
# and never executed anywhere but macOS. This runs them.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false # a failure on one platform must not hide the others' results
      matrix:
        # Windows is a release target (install.ps1 ships its build) but had
        # never run the suite. Its steps run under Git Bash, which puts the
        # `git` and `grep` tetel shells out to on PATH — the setup README
        # tells Windows users to have.
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      # Recorded rather than assumed: the suite has no declared MSRV, so
      # which compiler produced a green run is worth having in the log.
      - name: Toolchain
        run: |
          rustc --version
          cargo --version
          git --version

      # The MCP tests spawn the real binary as a child process and talk
      # JSON-RPC over its stdio, and the staleness tests rename a copy of
      # it out from under a running server. Neither had ever run off a
      # macOS developer machine before this workflow existed.
      - name: Test
        run: cargo test --all-targets --no-fail-fast

      - name: Release build
        run: cargo build --release
