[package]
name = "tetel"
version = "0.1.0"
edition = "2021"
description = "A checker for markdown design documents whose factual claims carry executable evidence"
license = "MIT"
repository = "https://github.com/lonic-software/tetel"

[[bin]]
name = "tetel"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
schemars = "1"
tokio = { version = "1", features = ["rt"] }
rmcp = { version = "3.1", features = ["transport-io"] }

[dev-dependencies]
rmcp = { version = "3.1", features = ["client", "transport-child-process"] }
