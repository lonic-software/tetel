version: 1
name: tetel

commands:
  - id: release
    title: Cut a release (bump → tag → push; CI builds and publishes)
    params:
      # next patch / minor / major from the latest vX.Y.Z tag, patch the default;
      # before the first tag, Cargo.toml's own version comes first
      version: { pick: { from: "./bin/release-candidates" } }
    run: "./bin/release {version}"

  - id: check
    title: Run exactly what CI runs (tests, release build)
    run: "./bin/check"

  - id: install
    title: Build this checkout and install it as your tetel
    run: "cargo install --path . --locked"
